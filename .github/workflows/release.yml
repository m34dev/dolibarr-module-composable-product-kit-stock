name: Package & Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pre-release
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Package module
        run: |
          echo "Packaging composableproductkitstock module ..."
          cp LICENSE.md composableproductkitstock/LICENSE.md
          cp README.md composableproductkitstock/README.md
          cp CHANGELOG.md composableproductkitstock/ChangeLog.md
          zip -r "module_composableproductkitstock-${{ github.ref_name }}.zip" composableproductkitstock/
          echo "composableproductkitstock module packaged."

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          body: Release created from CI/CD
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: module_composableproductkitstock-${{ github.ref_name }}.zip

